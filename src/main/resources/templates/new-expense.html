<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${event.eventName}"></title>
</head>
<body>
    <!-- 支出を記録するフォーム -->
    <h2>支出を記録</h2>
    <form th:action="@{'/events/' + ${event.id} + '/expenses'}" method="post">
        <label>項目：<input type="text" name="itemName"></label><br>
        <label>金額：<input type="number" name="amount"></label><br>
        <button type="submit">保存</button>
    </form>

    <p><a th:href="@{'/events/' + ${event.id}}">一覧に戻る</a></p>
</body>
</html>
