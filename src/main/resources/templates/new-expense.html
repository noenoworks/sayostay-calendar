<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${event.eventName}"></title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <!-- 支出を記録するフォーム -->
    <h2>支出を記録</h2>
    <form th:action="@{'/events/' + ${event.id} + '/expenses'}" method="post">
        <label>カテゴリ：
            <select name="category">
                <option value="チケット">チケット</option>
                <option value="グッズ">グッズ</option>
                <option value="食費">食費</option>
                <option value="交通費">交通費</option>
                <option value="その他">その他</option>
            </select>
        </label><br>
        <label>金額：<input type="number" name="amount"></label><br>
        <label>メモ：<input type="text" name="description"></label><br>
        <button type="submit">保存</button>
    </form>

    <p><a th:href="@{'/events/' + ${event.id}}">一覧に戻る</a></p>
</body>
</html>
