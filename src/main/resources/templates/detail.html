<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${event.eventName}"></title>
</head>
<body>
    <!-- イベントの基本情報 -->
    <h1 th:text="${event.eventName}"></h1>
    <p>開催日：<span th:text="${event.eventDate}"></span></p>
    <p>会場：<span th:text="${event.venue}"></span></p>

    <!-- このイベントの支出一覧 -->
    <h2>このイベントの支出</h2>
    <table border="1">
        <thead>
            <tr>
                <th>カテゴリ</th>
                <th>金額</th>
                <th>メモ</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="expense : ${event.expenses}">
                <td th:text="${expense.category}"></td>
                <td th:text="${expense.amount}"></td>
                <td th:text="${expense.description}"></td>
                <td>
                    <form th:action="@{'/events/' + ${event.id} + '/expenses/' + ${expense.id} + '/delete'}" method="post">
                        <button type="submit">削除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <p>合計：<span th:text="${event.totalExpense}"></span> 円</p>

    <!-- 支出を記録するフォーム -->
    <p><a th:href="@{'/events/' + ${event.id} + '/expenses/new'}">＋ 支出を記録する</a></p>

    <p><a th:href="@{/events}">一覧に戻る</a></p>
</body>
</html>
