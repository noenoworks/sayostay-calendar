<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>さよならステイチューン カレンダー</title>
</head>

<body>
    <h1>さよならステイチューン イベント一覧</h1>
    <h2>新規登録</h2>
    <p><a th:href="@{/events/new}">＋ イベント追加</a></p>
    <h2>表示切替</h2>
    <p><a th:href="@{/calendar}">カレンダー</a></p>

    <h2>登録済みイベント</h2>
    <table border="1">
        <thead>
            <tr>
                <th>イベント名</th>
                <th>開催日</th>
                <th>OPEN</th>
                <th>START</th>
                <th>会場</th>
                <th>チケット</th>
                <th>備考</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="event : ${events}">
                <td><a th:href="@{'/events/' + ${event.id}}" th:text="${event.eventName}"></a></td>
                <td th:text="${event.eventDate}"></td>
                <td th:text="${event.openTime}"></td>
                <td th:text="${event.startTime}"></td>
                <td th:text="${event.venue}"></td>
                <td th:text="${event.ticketPurchased} ? '購入済' : '未購入'"></td>
                <td th:text="${event.note}"></td>
                <td>
                    <a th:href="@{'/events/' + ${event.id} + '/edit'}">編集</a>
                    <form th:action="@{'/events/' + ${event.id} + '/delete'}" method="post">
                        <button type="submit">削除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
