<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>さよならステイチューン カレンダー</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>
    <h1>さよならステイチューン イベント一覧</h1>
    <h2>新規登録</h2>
    <p><a th:href="@{/events/new}">＋ イベント追加</a></p>
    <h2>表示切替</h2>
    <p><a th:href="@{/calendar}">カレンダー</a></p>

    <h2>登録済みイベント</h2>
    <div class="event-list">
        <a class="event-card" th:each="event : ${events}" th:href="@{'/events/' + ${event.id}}">
            <div class="event-date">
                <div th:text="${#temporals.format(event.eventDate, 'M/d')}"></div>
                <div class="event-day" th:text="${event.dayOfWeek}"></div>
            </div>
            <div class="event-info">
                <div class="event-name" th:text="${event.eventName}">イベント名</div>
                <div class="event-venue">🎤 <span th:text="${event.venue}">会場</span></div>
            </div>
            <div class="event-arrow">›</div>
        </a>
    </div>
</body>

</html>
